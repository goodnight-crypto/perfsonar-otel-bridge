[project]
name = "psotel-bridge"
version = "0.1.0"
description = "pScheduler HTTP archiver JSON を OpenTelemetry メトリクスに変換するブリッジ"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
# OTLP は SDK を使わず手組みする（psotel/otlp.py の docstring に理由）ため
# opentelemetry-sdk には依存しない。

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psotel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
