# /etc/chrony/conf.d/10-home-lab.conf
#
# Lima VM（perfsonar-vm）の時刻源を近距離のものに差し替える。
# 配置手順と根拠は deploy/vm/README.md。
#
# Ubuntu 既定の `pool ntp.ubuntu.com` は Canonical の欧州サーバで、当環境からの
# 実測 RTT は 256.8ms（ジッタ 17.6ms）。8ソース中4つがこれだったため root dispersion が
# 37.7ms まで膨らみ、TWAMP の max-clock-error が品質ゲート（10ms）を常時超えていた。
#
# 実測（2026-07-29、Mac から。VM と同一 LAN・同一 ISP）:
#   ntp.ubuntu.com        RTT 256.82ms  ジッタ 17.57ms   ← 既定。これを外す
#   time.cloudflare.com   RTT   9.28ms  ジッタ  1.63ms
#   ntp.jst.mfeed.ad.jp   RTT   9.37ms  ジッタ  2.80ms
#   ntp.nict.jp           RTT  18.49ms  ジッタ  2.11ms（stratum 1）
#   time.google.com       RTT  45.01ms  ジッタ  6.14ms
#
# 比較対象として、RasPi（systemd-timesyncd、2.debian.pool.ntp.org が国内 IPv6 に解決）は
# RootDelay 2.75ms / RootDispersion 1.02ms / Jitter 1.48ms で健全だった。
# 劣化していたのは VM だけ。

pool ntp.nict.jp         iburst maxsources 3 minpoll 4 maxpoll 6
pool ntp.jst.mfeed.ad.jp iburst maxsources 3 minpoll 4 maxpoll 6
server time.cloudflare.com iburst minpoll 4 maxpoll 6

# minpoll 4 / maxpoll 6 = 16〜64秒間隔。既定（64〜1024秒）より頻繁に引く。
# 公開サーバに対して失礼にならない範囲に留めること（minpoll 3 以下にはしない）。
#
# 差し替え前は chrony の周波数推定が 590〜2586ppm slow の幅で振れており、当初は
# vz(Virtualization.framework) のクロック取りこぼしだと考えたが、これは誤りだった。
# ソースを替えたら Frequency 2.39ppm / Skew 3.32ppm に収まった。
# RTT 257ms・ジッタ 30ms のソースからは周波数を推定しようがなかっただけで、
# VM のハードウェアクロック自体は健全。
